<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Meme Legends</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'Exo 2',sans-serif;
  background:radial-gradient(ellipse at 50% 20%, #0a1a3a 0%, #05080f 70%);
  min-height:100vh; color:#fff;
  user-select:none;
}

/* ── HEADER ── */
header {
  display:flex; align-items:center; gap:14px;
  padding:16px 24px;
  background:rgba(0,0,0,.4);
  border-bottom:1px solid rgba(255,255,255,.07);
  position:sticky; top:0; z-index:50;
}
.back-btn {
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.15);
  color:#aaa; padding:7px 16px; border-radius:10px;
  cursor:pointer; font-family:'Exo 2',sans-serif;
  font-size:.85em; font-weight:600;
  transition:all .2s; text-decoration:none; display:inline-flex; align-items:center; gap:6px;
}
.back-btn:hover { background:rgba(255,255,255,.12); color:#fff; }
header h1 {
  font-family:'Cinzel',serif; font-size:1.2em;
  background:linear-gradient(135deg,#88aaff,#4466ff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
.save-btn {
  margin-left:auto;
  background:linear-gradient(135deg,#1a5a1a,#0a3a0a);
  border:2px solid #44cc66; color:#44ff88;
  padding:8px 22px; border-radius:12px;
  cursor:pointer; font-family:'Exo 2',sans-serif;
  font-size:.9em; font-weight:700;
  transition:all .2s;
}
.save-btn:hover { box-shadow:0 0 16px rgba(68,255,136,.4); transform:scale(1.04); }

/* ── MAIN LAYOUT ── */
main {
  max-width:900px; margin:0 auto;
  padding:28px 20px 60px;
  display:flex; flex-direction:column; gap:32px;
}

/* ── PROFILE CARD ── */
.profile-hero {
  display:flex; align-items:center; gap:24px;
  background:linear-gradient(135deg,rgba(68,102,255,.12),rgba(0,0,0,.3));
  border:1px solid rgba(68,102,255,.25);
  border-radius:20px; padding:24px 28px;
  animation:fade-up .4s ease both;
}
@keyframes fade-up {
  from { transform:translateY(20px); opacity:0; }
  to   { transform:translateY(0);    opacity:1; }
}

#big-avatar {
  width:100px; height:100px; border-radius:50%;
  object-fit:cover; object-position:center top;
  border:3px solid #4466ff;
  box-shadow:0 0 24px rgba(68,102,255,.5);
  background:#0a0a2a; flex-shrink:0;
  transition:all .3s;
}
#big-avatar.pulse {
  animation:avatar-pulse .4s ease;
}
@keyframes avatar-pulse {
  0%   { transform:scale(1); }
  40%  { transform:scale(1.12); box-shadow:0 0 40px rgba(68,102,255,.8); }
  100% { transform:scale(1); }
}

.hero-info { flex:1; }
.name-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
#name-input {
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.2);
  border-radius:10px; padding:9px 14px;
  color:#fff; font-family:'Exo 2',sans-serif;
  font-size:1.1em; font-weight:700;
  width:100%; max-width:280px;
  transition:border-color .2s;
  outline:none;
}
#name-input:focus { border-color:#4466ff; box-shadow:0 0 0 3px rgba(68,102,255,.2); }
.char-count { font-size:.7em; color:#555; white-space:nowrap; }

.stats-row {
  display:flex; gap:16px; flex-wrap:wrap;
}
.stat-box {
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px; padding:10px 18px;
  text-align:center; min-width:80px;
}
.stat-num  { font-size:1.5em; font-weight:800; display:block; }
.stat-label{ font-size:.65em; color:#777; text-transform:uppercase; letter-spacing:1px; }
.stat-wins  .stat-num { color:#44ff88; }
.stat-losses .stat-num { color:#ff5555; }
.stat-rate  .stat-num { color:#ffcc44; }
.stat-games .stat-num { color:#88aaff; }

/* ── SECTION HEADING ── */
.section-heading {
  display:flex; align-items:center; gap:10px;
  font-size:.8em; font-weight:700; text-transform:uppercase;
  letter-spacing:2px; color:#666;
  margin-bottom:16px;
  animation:fade-up .4s .1s ease both;
}
.section-heading::after {
  content:''; flex:1; height:1px; background:rgba(255,255,255,.07);
}

/* ── AVATAR GRID ── */
.avatar-section { animation:fade-up .4s .15s ease both; }

.avatar-grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap:12px;
}

.avatar-item {
  cursor:pointer;
  border-radius:14px;
  border:2px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  overflow:hidden;
  transition:all .2s;
  position:relative;
}
.avatar-item:hover {
  border-color:rgba(68,102,255,.6);
  transform:translateY(-4px) scale(1.03);
  box-shadow:0 8px 24px rgba(68,102,255,.25);
}
.avatar-item.selected {
  border-color:#4466ff;
  box-shadow:0 0 0 3px rgba(68,102,255,.4), 0 8px 24px rgba(68,102,255,.3);
}
.avatar-item img {
  width:100%; aspect-ratio:1/1;
  object-fit:cover; object-position:center top;
  display:block;
}
.avatar-item .av-name {
  padding:5px 6px;
  font-size:.6em; text-align:center;
  color:#aaa; font-weight:600;
  background:rgba(0,0,0,.6);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.avatar-item.selected .av-name { color:#88aaff; }

.selected-badge {
  position:absolute; top:5px; right:5px;
  background:#4466ff; border-radius:50%;
  width:20px; height:20px;
  display:none; align-items:center; justify-content:center;
  font-size:.75em;
}
.avatar-item.selected .selected-badge { display:flex; }

/* ── DANGER ZONE ── */
.danger-zone { animation:fade-up .4s .2s ease both; }
.reset-btn {
  background:rgba(255,50,50,.08);
  border:1.5px solid rgba(255,50,50,.3);
  color:#ff6666; padding:10px 22px; border-radius:10px;
  cursor:pointer; font-family:'Exo 2',sans-serif;
  font-size:.85em; font-weight:700; transition:all .2s;
}
.reset-btn:hover { background:rgba(255,50,50,.18); border-color:#ff4444; }

/* ── TOAST ── */
#toast {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px);
  background:rgba(10,20,10,.95); border:1px solid #44cc66;
  border-radius:12px; padding:12px 24px;
  font-weight:700; color:#44ff88; font-size:.95em;
  transition:transform .3s ease; z-index:100;
  pointer-events:none;
}
#toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <a class="back-btn" href="index.html">◀ Back</a>
  <h1>👤 Profile</h1>
  <button class="save-btn" onclick="saveProfile()">💾 Save</button>
</header>

<main>
  <!-- Hero card -->
  <div class="profile-hero">
    <img id="big-avatar" src="" alt="Avatar">
    <div class="hero-info">
      <div class="name-row">
        <input id="name-input" type="text" maxlength="20" placeholder="Enter your name…" oninput="updateCharCount()">
        <span class="char-count"><span id="char-num">0</span>/20</span>
      </div>
      <div class="stats-row">
        <div class="stat-box stat-games">
          <span class="stat-num" id="s-total">0</span>
          <span class="stat-label">Games</span>
        </div>
        <div class="stat-box stat-wins">
          <span class="stat-num" id="s-wins">0</span>
          <span class="stat-label">Wins</span>
        </div>
        <div class="stat-box stat-losses">
          <span class="stat-num" id="s-losses">0</span>
          <span class="stat-label">Losses</span>
        </div>
        <div class="stat-box stat-rate">
          <span class="stat-num" id="s-rate">0%</span>
          <span class="stat-label">Win Rate</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Avatar picker -->
  <div class="avatar-section">
    <div class="section-heading">🖼️ Choose Your Meme Avatar</div>
    <div class="avatar-grid" id="avatar-grid"></div>
  </div>

  <!-- Danger zone -->
  <div class="danger-zone">
    <div class="section-heading">⚠️ Danger Zone</div>
    <button class="reset-btn" onclick="confirmReset()">🗑️ Reset All Stats</button>
  </div>
</main>

<div id="toast">✅ Profile saved!</div>

<script>
const MEME_AVATARS = [
  { id:'doge',          name:'Doge',              img:'https://i.kym-cdn.com/photos/images/original/000/581/296/c09.jpg' },
  { id:'fire_dog',      name:'This Is Fine',       img:'https://i.imgflip.com/wxica.jpg' },
  { id:'grumpy_cat',    name:'Grumpy Cat',         img:'https://i.kym-cdn.com/entries/icons/facebook/000/011/365/GRUMPYCAT.jpg' },
  { id:'trollface',     name:'Trollface',           img:'https://i.kym-cdn.com/entries/icons/facebook/000/000/091/TrollFace.jpg' },
  { id:'drake',         name:'Drake',              img:'https://i.imgflip.com/30b1gx.jpg' },
  { id:'distracted_bf', name:'Distracted BF',      img:'https://i.imgflip.com/1ur9b0.jpg' },
  { id:'surprised_pika',name:'Surprised Pikachu',  img:'https://i.imgflip.com/2kbn1e.jpg' },
  { id:'woman_cat',     name:'Woman Yelling',      img:'https://i.imgflip.com/345v97.jpg' },
  { id:'pepe',          name:'Pepe the Frog',      img:'https://i.kym-cdn.com/entries/icons/original/000/000/142/feelsgoodman.png' },
  { id:'chad',          name:'Gigachad',           img:'https://i.kym-cdn.com/entries/icons/facebook/000/026/152/gigachadd.jpg' },
  { id:'galaxy_brain',  name:'Galaxy Brain',       img:'https://i.imgflip.com/1jwhww.jpg' },
  { id:'harold',        name:'Hide the Pain Harold',img:'https://i.imgflip.com/gk5el.jpg' },
  { id:'minion',        name:"Gru's Minion",       img:'https://i.imgflip.com/26jxvz.jpg' },
  { id:'salt_bae',      name:'Salt Bae',           img:'https://i.kym-cdn.com/entries/icons/facebook/000/021/971/Salt-Bae-001.jpg' },
  { id:'two_buttons',   name:'Two Buttons Guy',    img:'https://i.imgflip.com/1g8my4.jpg' },
  { id:'expand_brain',  name:'Expanding Brain',    img:'https://i.imgflip.com/1jwhww.jpg' },
  { id:'confused_math', name:'Confused Math Lady', img:'https://i.kym-cdn.com/entries/icons/facebook/000/021/464/14608107_1180665285312703_1558693314_n.jpg' },
  { id:'baby_yoda',     name:'Baby Yoda',          img:'https://i.kym-cdn.com/entries/icons/mobile/000/031/827/bright.jpg' },
  { id:'shrek',         name:'Shrek',              img:'https://i.kym-cdn.com/entries/icons/facebook/000/012/178/shrek.jpg' },
  { id:'mock_spong',    name:'Mocking SpongeBob',  img:'https://i.imgflip.com/1otk96.jpg' },
  { id:'stonks',        name:'Stonks Man',         img:'https://i.kym-cdn.com/entries/icons/facebook/000/029/959/Screen_Shot_2019-06-05_at_1.26.32_PM.jpg' },
  { id:'leonidas',      name:'Leonidas',           img:'https://i.kym-cdn.com/entries/icons/facebook/000/000/026/Gerard-Butler-This-Is-Sparta.jpg' },
  { id:'uno_reverse',   name:'UNO Reverse',        img:'https://i.imgflip.com/3lmzyx.jpg' },
  { id:'bernie',        name:'Bernie Mittens',     img:'https://i.imgflip.com/3oevdk.jpg' },
  { id:'disaster_girl', name:'Disaster Girl',      img:'https://i.imgflip.com/23ls.jpg' }
];

let selectedAvatar = localStorage.getItem('ml_avatar') || MEME_AVATARS[0].id;

// ── LOAD DATA ──
function loadData() {
  const name   = localStorage.getItem('ml_name') || '';
  const wins   = parseInt(localStorage.getItem('ml_wins')  || 0);
  const losses = parseInt(localStorage.getItem('ml_losses')|| 0);
  const total  = wins + losses;
  const rate   = total ? Math.round((wins/total)*100) : 0;

  document.getElementById('name-input').value = name;
  document.getElementById('char-num').textContent = name.length;
  document.getElementById('s-total').textContent  = total;
  document.getElementById('s-wins').textContent   = wins;
  document.getElementById('s-losses').textContent = losses;
  document.getElementById('s-rate').textContent   = rate + '%';

  updateBigAvatar();
}

function updateBigAvatar() {
  const av = MEME_AVATARS.find(a=>a.id===selectedAvatar) || MEME_AVATARS[0];
  const img = document.getElementById('big-avatar');
  img.src = av.img;
  img.classList.remove('pulse');
  void img.offsetWidth;
  img.classList.add('pulse');
}

function updateCharCount() {
  const v = document.getElementById('name-input').value;
  document.getElementById('char-num').textContent = v.length;
}

// ── BUILD AVATAR GRID ──
function buildGrid() {
  const grid = document.getElementById('avatar-grid');
  grid.innerHTML = '';
  MEME_AVATARS.forEach(av => {
    const item = document.createElement('div');
    item.className = 'avatar-item' + (av.id===selectedAvatar?' selected':'');
    item.dataset.id = av.id;
    item.innerHTML = `
      <img src="${av.img}" alt="${av.name}" loading="lazy" onerror="this.style.background='#1a1a2a';this.style.height='80px'">
      <div class="av-name">${av.name}</div>
      <div class="selected-badge">✓</div>
    `;
    item.addEventListener('click', () => selectAvatar(av.id));
    grid.appendChild(item);
  });
}

function selectAvatar(id) {
  selectedAvatar = id;
  document.querySelectorAll('.avatar-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });
  updateBigAvatar();
}

// ── SAVE ──
function saveProfile() {
  const name = document.getElementById('name-input').value.trim() || 'Anonymous Memer';
  localStorage.setItem('ml_name',   name);
  localStorage.setItem('ml_avatar', selectedAvatar);
  showToast('✅ Profile saved!');
}

// ── RESET ──
function confirmReset() {
  if(!confirm('Reset all win/loss stats? This cannot be undone.')) return;
  localStorage.setItem('ml_wins', 0);
  localStorage.setItem('ml_losses', 0);
  document.getElementById('s-total').textContent   = 0;
  document.getElementById('s-wins').textContent    = 0;
  document.getElementById('s-losses').textContent  = 0;
  document.getElementById('s-rate').textContent    = '0%';
  showToast('🗑️ Stats reset!');
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ── INIT ──
loadData();
buildGrid();
</script>
</body>
</html>
