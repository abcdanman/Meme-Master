<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meme Legends: Card Battle</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --felt: #1a3a1a;
  --felt2: #0e2010;
  --gold: #c8960c;
  --border: rgba(200,150,12,0.4);
}

body {
  font-family:'Exo 2',sans-serif;
  background: radial-gradient(ellipse at 50% 0%, #1a3a1a 0%, #0a180a 60%, #060c06 100%);
  min-height:100vh;
  color:#fff;
  overflow:hidden;
  user-select:none;
}

/* ── BOARD ── */
#board {
  display:grid;
  grid-template-rows: 90px 42px 150px 56px 150px 42px 190px;
  height:100vh;
  width:100vw;
  padding:6px 12px;
  gap:0;
}

/* ── AI HAND ── */
#ai-hand {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:4px;
  padding:4px 0;
}
.ai-card-back {
  width:52px; height:72px;
  border-radius:7px;
  background:linear-gradient(135deg,#1a1a4a,#0a0a2a);
  border:2px solid #3a3a7a;
  display:flex; align-items:center; justify-content:center;
  font-size:1.4em; color:#3a3a7a;
  box-shadow:0 2px 6px rgba(0,0,0,0.5);
}

/* ── INFO BARS ── */
.info-bar {
  display:flex;
  align-items:center;
  gap:10px;
  padding:2px 8px;
}
.hero-wrap { position:relative; }
.hero-portrait {
  width:50px; height:50px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:1.6em;
  border:3px solid;
  cursor:pointer;
  transition:transform .15s, box-shadow .15s;
  flex-shrink:0;
}
.hero-portrait:hover { transform:scale(1.08); }
.hero-portrait.player-hero { background:radial-gradient(#1a4a8a,#061830); border-color:#4a8aff; box-shadow:0 0 12px rgba(74,138,255,.4); }
.hero-portrait.ai-hero    { background:radial-gradient(#8a1a1a,#300808); border-color:#ff5555; box-shadow:0 0 12px rgba(255,85,85,.4); }
.hero-hp {
  position:absolute; bottom:-4px; left:50%; transform:translateX(-50%);
  background:#0a200a; color:#44ff88; font-weight:800; font-size:.65em;
  padding:1px 7px; border-radius:8px; border:1.5px solid #44ff88;
  white-space:nowrap;
}

.mana-row { display:flex; gap:3px; align-items:center; flex-wrap:wrap; max-width:160px; }
.crystal {
  width:16px; height:16px; border-radius:50%;
  border:1.5px solid #4a4aff; transition:all .2s;
}
.crystal.full  { background:radial-gradient(#7777ff,#2222aa); box-shadow:0 0 4px #4444ff; }
.crystal.empty { background:#12122a; }
.mana-label { color:#8888ff; font-size:.7em; font-weight:600; margin-left:3px; }

.deck-pill {
  background:linear-gradient(135deg,#1a1a3a,#0a0a2a);
  border:1.5px solid #3a3a7a; border-radius:8px;
  padding:3px 10px; font-size:.7em; color:#6666cc;
  display:flex; align-items:center; gap:5px;
}

.ai-bar { justify-content:flex-end; flex-direction:row-reverse; }

/* ── BATTLEFIELD ── */
.battlefield {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:6px;
  border:1.5px dashed rgba(255,255,255,0.08);
  border-radius:12px;
  background:rgba(0,0,0,0.15);
  position:relative;
  min-height:148px;
}
.field-label {
  position:absolute; left:8px; top:50%; transform:translateY(-50%);
  font-size:.6em; color:rgba(255,255,255,0.15); text-transform:uppercase;
  letter-spacing:2px; writing-mode:vertical-rl;
}

/* ── MIDDLE BAR ── */
#middle-bar {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:4px 12px;
  background:rgba(0,0,0,0.3);
  border-top:1px solid rgba(255,255,255,0.06);
  border-bottom:1px solid rgba(255,255,255,0.06);
}
#turn-indicator {
  font-size:.75em; color:#aaa; text-transform:uppercase; letter-spacing:2px;
  min-width:130px; text-align:center;
}
#end-turn-btn {
  background:linear-gradient(135deg,#1a5a1a,#0a3a0a);
  color:#44ff88; border:2px solid #44aa66;
  padding:7px 20px; font-size:.85em;
  font-family:'Exo 2',sans-serif; font-weight:700;
  border-radius:20px; cursor:pointer;
  transition:all .2s; text-transform:uppercase; letter-spacing:1px;
}
#end-turn-btn:hover:not(:disabled) { background:linear-gradient(135deg,#2a7a2a,#1a5a1a); box-shadow:0 0 12px rgba(68,255,136,.4); }
#end-turn-btn:disabled { opacity:.4; cursor:not-allowed; }
#log {
  background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.1);
  border-radius:8px; padding:5px 8px; width:240px;
  height:46px; overflow-y:auto; font-size:.68em;
  scrollbar-width:thin; scrollbar-color:#333 transparent;
}
.le { color:#bbb; padding:1px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
.le.dmg { color:#ff8888; }
.le.heal { color:#88ff99; }
.le.ev  { color:#ffdd77; }
.le.die { color:#ff4444; font-weight:700; }

/* ── CARDS ── */
.card {
  width:104px; height:148px;
  border-radius:9px;
  position:relative; flex-shrink:0;
  cursor:pointer;
  transition:transform .15s, box-shadow .15s;
}
.card:hover:not(.exhausted) { transform:translateY(-6px) scale(1.04); }

.card.selected   { box-shadow:0 0 22px 6px #ffee00 !important; transform:translateY(-12px) scale(1.06) !important; }
.card.can-atk    { box-shadow:0 0 14px 3px #ff7700; animation:pulse-atk 1.2s ease-in-out infinite; }
.card.targetable { box-shadow:0 0 14px 3px #ff2222; cursor:crosshair; }
.card.exhausted  { opacity:.55; filter:grayscale(40%); }

@keyframes pulse-atk {
  0%,100% { box-shadow:0 0 8px 2px #ff7700; }
  50%      { box-shadow:0 0 20px 6px #ff9900; }
}
@keyframes shake {
  0%,100% { transform:translateX(0); }
  20%,60% { transform:translateX(-5px); }
  40%,80% { transform:translateX(5px); }
}
@keyframes pop-in {
  from { transform:scale(.4) translateY(-30px); opacity:0; }
  to   { transform:scale(1) translateY(0); opacity:1; }
}
@keyframes death-out {
  0%   { transform:scale(1); opacity:1; }
  50%  { transform:scale(1.2) rotate(10deg); filter:brightness(2); }
  100% { transform:scale(0) rotate(25deg); opacity:0; }
}
.card.playing { animation:pop-in .3s ease-out; }
.card.dying   { animation:death-out .4s ease-in forwards; pointer-events:none; }
.card.shaking { animation:shake .3s ease; }

.card-inner {
  width:100%; height:100%;
  border-radius:9px;
  border:2.5px solid;
  overflow:hidden;
  display:flex; flex-direction:column;
  position:relative;
  box-shadow:inset 0 0 20px rgba(0,0,0,0.4);
}

.cost-badge {
  position:absolute; top:-7px; left:-7px;
  width:26px; height:26px; border-radius:50%;
  background:radial-gradient(#5555ff,#1a1a88);
  border:2px solid #8888ff;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:.85em; z-index:10;
}

.c-name {
  background:rgba(0,0,0,0.75);
  font-size:.54em; font-weight:700;
  text-align:center; padding:3px 2px;
  text-transform:uppercase; letter-spacing:.5px;
  flex-shrink:0;
}
.c-art {
  flex:1; display:flex; align-items:center; justify-content:center;
  font-size:2.8em; flex-direction:column; gap:0; line-height:1;
  position:relative;
  background:rgba(0,0,0,0.2);
  overflow:hidden;
}
.c-art img {
  width:100%; height:100%;
  object-fit:cover; object-position:center top;
  display:block;
}
.c-art .art-emoji { filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }
.c-ability {
  background:rgba(0,0,0,0.82);
  font-size:.46em; text-align:center;
  padding:3px 4px; min-height:30px; line-height:1.25;
  color:#ddd; flex-shrink:0;
}
.c-stats {
  display:flex; justify-content:space-between; padding:3px 6px;
  background:rgba(0,0,0,0.9); flex-shrink:0;
}
.c-atk { color:#ff7777; font-weight:800; font-size:.88em; }
.c-hp  { font-weight:800; font-size:.88em; }

.hp-track {
  position:absolute; bottom:0; left:0; right:0; height:3px; background:#1a0a0a;
}
.hp-fill { height:100%; transition:width .3s; border-radius:0 2px 2px 0; }

.status-row {
  position:absolute; top:18px; right:2px;
  display:flex; flex-direction:column; gap:1px;
}
.sbadge { font-size:.65em; }

.kwrap { display:flex; flex-wrap:wrap; justify-content:center; gap:1px; margin-bottom:1px; }
.kw {
  font-size:.42em; padding:1px 4px; border-radius:3px;
  font-weight:700; text-transform:uppercase;
}
.kw-taunt   { background:#5a2800; color:#ffaa44; }
.kw-rush    { background:#00285a; color:#44aaff; }
.kw-lifelink{ background:#00320a; color:#44ff88; }
.kw-dodge   { background:#2a0050; color:#cc88ff; }
.kw-evolve  { background:#003028; color:#44ffdd; }

/* rarity borders */
.r-common    { border-color:#777; }
.r-rare      { border-color:#4488ff; box-shadow:0 0 6px rgba(68,136,255,.3); }
.r-epic      { border-color:#aa44ff; box-shadow:0 0 8px rgba(170,68,255,.4); }
.r-legendary { border-color:#ff9900; box-shadow:0 0 14px rgba(255,153,0,.5); animation:legend-glow 2s ease-in-out infinite; }
@keyframes legend-glow {
  0%,100% { box-shadow:0 0 10px rgba(255,153,0,.4); }
  50%      { box-shadow:0 0 22px rgba(255,200,0,.7); }
}

/* ── PLAYER HAND ── */
#player-hand {
  display:flex; justify-content:center; align-items:flex-end;
  gap:6px; padding:8px 4px 4px;
  overflow-x:auto; overflow-y:visible;
}
#player-hand .card:hover:not(.exhausted) { transform:translateY(-22px) scale(1.08); }
#player-hand .card.unaffordable { opacity:.45; filter:grayscale(50%); }

/* ── FLOATING DAMAGE ── */
.dmg-float {
  position:fixed; pointer-events:none; z-index:999;
  font-weight:900; text-shadow:2px 2px 4px rgba(0,0,0,.8);
  animation:float-dmg .9s ease-out forwards;
}
@keyframes float-dmg {
  0%   { transform:translateY(0) scale(1); opacity:1; }
  100% { transform:translateY(-55px) scale(1.3); opacity:0; }
}

/* ── AI THINKING ── */
#ai-thinking {
  display:none; position:fixed;
  top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.9); border:2px solid #555;
  border-radius:14px; padding:14px 30px;
  font-size:1em; z-index:300; color:#ccc;
  letter-spacing:1px;
}

/* ── GAME OVER ── */
#game-over {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.88); z-index:500;
  flex-direction:column; align-items:center; justify-content:center; gap:20px;
}
#game-over.show { display:flex; }
#game-over h1 {
  font-family:'Cinzel',serif; font-size:4em;
  text-shadow:0 0 30px currentColor; animation:pop-in .5s ease-out;
}
#game-over.win  h1 { color:#ffdd00; }
#game-over.lose h1 { color:#ff4444; }
#game-over p { font-size:1.1em; color:#aaa; text-align:center; max-width:400px; }
#restart-btn {
  background:linear-gradient(135deg,#3a1a6a,#1a0a3a);
  color:#cc88ff; border:2px solid #8844ff;
  padding:12px 36px; font-size:1.1em;
  border-radius:24px; cursor:pointer;
  font-family:'Exo 2',sans-serif; font-weight:700;
  transition:all .2s;
}
#restart-btn:hover { box-shadow:0 0 25px rgba(136,68,255,.7); transform:scale(1.05); }

/* ── TOOLTIP ── */
#tooltip {
  display:none; position:fixed; z-index:400;
  pointer-events:none; width:200px;
  background:rgba(10,10,20,0.97); border:1px solid rgba(255,255,255,.2);
  border-radius:10px; padding:10px; font-size:.75em; color:#ddd;
  line-height:1.5;
}
#tooltip .tt-name { font-weight:800; font-size:1.1em; color:#fff; margin-bottom:4px; }
#tooltip .tt-flavor { color:#888; font-style:italic; margin-top:6px; font-size:.9em; }

/* ── SCROLLBARS ── */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }
</style>
</head>

// ═══════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════
let G = {};

function freshCard(def) {
  return {
    ...JSON.parse(JSON.stringify(def)),
    iid: Math.random().toString(36).slice(2,10),
    curHp: def.hp,
    curAtk: def.atk,
    exhausted: true,
    status: {},
    passive: def.passive ? JSON.parse(JSON.stringify(def.passive)) : null,
    battlecry: def.battlecry ? JSON.parse(JSON.stringify(def.battlecry)) : null
  };
}

function buildDeck() {
  const shuffled = [...CARDS].sort(()=>Math.random()-.5);
  return shuffled.map(freshCard);
}

function newPlayer(ai) {
  return { hp:30, maxHp:30, mana:0, maxMana:0, hand:[], field:[], deck:buildDeck(), ai };
}

function initGame() {
  document.getElementById('game-over').className='';
  document.getElementById('game-over').style.display='none';

  G = {
    player: newPlayer(false),
    ai: newPlayer(true),
    turn: 'player',
    turnNum: 1,
    sel: null,       // selected field card for attack
    gameOver: false
  };

  for(let i=0;i<4;i++) drawCard(G.player);
  for(let i=0;i<4;i++) drawCard(G.ai);

  clearLog();
  log('⚔️ MEME LEGENDS: CARD BATTLE starts! May the dankest memes win!','ev');
  startTurn('player');
}

// ═══════════════════════════════════════════
// DECK / DRAW
// ═══════════════════════════════════════════
function drawCard(p) {
  if(p.deck.length === 0) {
    log(`${p.ai?'Opponent':'You'} ran out of cards! -3 fatigue.`,'dmg');
    hurtHero(p, 3);
    return;
  }
  if(p.hand.length >= 10) {
    p.deck.shift();
    log(`${p.ai?'Opponent\'s':'Your'} hand is full — card burned.`,'ev');
    return;
  }
  p.hand.push(p.deck.shift());
}

// ═══════════════════════════════════════════
// TURN MANAGEMENT
// ═══════════════════════════════════════════
function startTurn(who) {
  if(G.gameOver) return;
  const p = who==='player' ? G.player : G.ai;
  G.turn = who;
  G.sel = null;

  // Mana
  p.maxMana = Math.min(10, G.turnNum);
  p.mana = p.maxMana;

  // Draw
  if(G.turnNum > 1 || who==='ai') drawCard(p);

  // Refresh & passives tick
  p.field.forEach(c => {
    c.exhausted = false;

    if(c.passive) {
      // Evolve / Stonks — gain ATK each turn
      if(c.passive.type==='evolve' || c.passive.type==='stonks') {
        c.curAtk += c.passive.gain;
        if(c.passive.type==='stonks') log(`📈 ${c.name} STONKS! ATK now ${c.curAtk}.`,'ev');
        else log(`🧠 ${c.name} expands! ATK now ${c.curAtk}.`,'ev');
      }
      // Gang up
      if(c.passive.type==='gang_up') recalcGang(p);
      // Harold burst
      if(c.passive.type==='burst') {
        c.passive.turn++;
        if(c.passive.turn >= 3 && c.passive.stored > 0) {
          const opp = who==='player' ? G.ai : G.player;
          log(`💣 ${c.name} releases ${c.passive.stored} burst damage on enemy hero!`,'dmg');
          hurtHero(opp, c.passive.stored);
          c.passive.stored = 0;
          c.passive.turn = 0;
        }
      }
    }

    // Burn tick
    if(c.status.burn) {
      c.status.burn.turns--;
      log(`🔥 ${c.name} burns for ${c.status.burn.amt}!`,'dmg');
      hurtCard(c, p, c.status.burn.amt, false);
      if(c.status.burn.turns <= 0) delete c.status.burn;
    }
  });

  render();
  updateTurnUI(who);

  if(who==='ai') setTimeout(doAI, 800);
}

function endTurn() {
  if(G.turn!=='player' || G.gameOver) return;
  G.sel = null;
  log('🔄 You end your turn.','ev');
  G.turnNum++;
  startTurn('ai');
}

function updateTurnUI(who) {
  document.getElementById('turn-indicator').textContent =
    who==='player' ? '⚔️ Your Turn' : '🤖 Opponent\'s Turn';
  document.getElementById('end-turn-btn').disabled = (who!=='player');
}

// ═══════════════════════════════════════════
// PLAY A CARD
// ═══════════════════════════════════════════
function playCard(card, p) {
  if(p.mana < card.cost) { if(!p.ai) log('❌ Not enough mana!','ev'); return false; }
  if(p.field.length >= 5) { if(!p.ai) log('❌ Field is full!','ev'); return false; }

  p.mana -= card.cost;
  p.hand = p.hand.filter(c=>c.iid!==card.iid);

  // Ready card for field
  card.exhausted = !(card.kw && card.kw.includes('rush'));
  card.curHp = card.hp;
  card.curAtk = card.atk;
  card.status = {};
  if(card.passive) {
    if(card.passive.type==='enrage') card.passive.used=false;
    if(card.passive.type==='first_atk_double') card.passive.used=false;
    if(card.passive.type==='first_dmg_reduce') card.passive.used=false;
    if(card.passive.type==='burst'){ card.passive.stored=0; card.passive.turn=0; }
  }

  p.field.push(card);
  log(`🎴 ${p.ai?'Opponent':'You'} play ${card.name}!`,'ev');

  if(card.battlecry) doBattlecry(card, p);
  recalcGangs(p);
  render();
  return true;
}

function doBattlecry(card, p) {
  const opp = p===G.player ? G.ai : G.player;
  const bc = card.battlecry;

  switch(bc.type) {
    case 'draw':
      for(let i=0;i<bc.n;i++) drawCard(p);
      log(`🃏 ${card.name} draws ${bc.n} card(s)!`,'ev');
      break;

    case 'zap_hero':
      hurtHero(opp, bc.amt);
      log(`⚡ ${card.name} zaps opponent for ${bc.amt}!`,'dmg');
      break;

    case 'silence':
      if(p.passive && p.passive.type==='debuff_immune') break; // shouldn't happen
      const tgt = pickSilenceTarget(opp);
      if(tgt) {
        if(tgt.passive && tgt.passive.type==='debuff_immune') {
          log(`${tgt.name} is immune to silence!`,'ev');
        } else {
          tgt.passive=null; tgt.battlecry=null; tgt.kw=[];
          tgt.abilityText='(Silenced 😾)';
          log(`😾 ${card.name} silences ${tgt.name}!`,'ev');
        }
      }
      break;

    case 'snipe': {
      // Target highest-HP enemy minion, else hero
      const target = opp.field.length
        ? opp.field.reduce((a,b)=>a.curHp>b.curHp?a:b)
        : null;
      if(target) {
        log(`🎯 Galaxy Brain fires at ${target.name} for ${bc.amt}!`,'dmg');
        hurtCard(target, opp, bc.amt, false);
      } else {
        hurtHero(opp, bc.amt);
        log(`🎯 Galaxy Brain fires at enemy face for ${bc.amt}!`,'dmg');
      }
      break;
    }

    case 'burn': {
      if(opp.field.length) {
        const t = opp.field[Math.floor(Math.random()*opp.field.length)];
        t.status.burn = {amt:bc.amt, turns:bc.turns};
        log(`🧂 ${card.name} salts ${t.name}! Burns ${bc.amt}/turn for ${bc.turns} turns!`,'ev');
      } else {
        log(`🧂 ${card.name} has no target... just seasons the air.`,'ev');
      }
      break;
    }

    case 'chaos': {
      const fx = [
        ()=>{ drawCard(p); log('🎲 Chaos: Drew a card!','ev'); },
        ()=>{ hurtHero(opp,5); log('🎲 Chaos: Zapped enemy for 5!','dmg'); },
        ()=>{ p.hp=Math.min(p.maxHp,p.hp+6); log('🎲 Chaos: Healed 6 HP!','heal'); },
        ()=>{ p.field.forEach(c=>c.curAtk+=2); log('🎲 Chaos: All your minions +2 ATK!','ev'); },
        ()=>{
          if(opp.field.length){
            const t=opp.field[Math.floor(Math.random()*opp.field.length)];
            hurtCard(t,opp,8,false); log(`🎲 Chaos: Chaos bolt hits ${t.name} for 8!`,'dmg');
          } else { hurtHero(opp,8); log('🎲 Chaos: Chaos bolt hits face for 8!','dmg'); }
        },
        ()=>{ drawCard(p); drawCard(p); log('🎲 Chaos: Drew 2 cards!','ev'); }
      ];
      fx[Math.floor(Math.random()*fx.length)]();
      break;
    }

    case 'copy_buff': {
      const srcs = opp.field.filter(c=>c.curAtk>c.atk);
      if(srcs.length) {
        const src=srcs[Math.floor(Math.random()*srcs.length)];
        const diff=src.curAtk-src.atk;
        card.curAtk+=diff;
        log(`🔁 ${card.name} copies +${diff} ATK from ${src.name}!`,'ev');
      } else {
        log(`🔁 ${card.name} finds nothing worth copying... sad.`,'ev');
      }
      break;
    }

    case 'heal_all':
      p.field.forEach(c=>{ if(c.iid!==card.iid) c.curHp=Math.min(c.hp,c.curHp+bc.amt); });
      p.hp=Math.min(p.maxHp,p.hp+bc.amt);
      log(`🧤 ${card.name} heals all allies and hero for ${bc.amt}!`,'heal');
      break;

    case 'aoe':
      [...opp.field].forEach(c=>{ log(`💥 AOE hits ${c.name} for ${bc.amt}!`,'dmg'); hurtCard(c,opp,bc.amt,false); });
      hurtHero(opp,bc.amt);
      log(`💥 Disaster Girl blasts enemy face for ${bc.amt}!`,'dmg');
      break;
  }
}

// ═══════════════════════════════════════════
// COMBAT
// ═══════════════════════════════════════════
// Returns 'dodged'|'reflected'|true
function hurtCard(card, owner, dmg, isAtk) {
  if(!owner.field.includes(card) && owner !== (card._owner||owner)) return true; // already dead check
  const p = card.passive;

  // Burn immune
  if(p && p.type==='burn_immune' && card.status.burn) {
    log(`🔥 ${card.name} is immune to burn!`,'ev');
    return 'dodged';
  }

  // Dodge
  if(p && p.type==='dodge' && isAtk && Math.random()<p.chance) {
    log(`🐕 ${card.name} dodges! Much evade! Wow.`,'ev');
    showFloat(card, '💨DODGE', '#aaff88');
    return 'dodged';
  }

  // Dodge-counter
  if(p && p.type==='dodge_counter' && isAtk && Math.random()<p.chance) {
    log(`🤔 ${card.name} dodges and counters!`,'ev');
    return 'dodge_counter';
  }

  // Full reflect (UNO)
  if(p && p.type==='full_reflect' && isAtk) {
    log(`🔄 ${card.name}: No U! Attack reflected!`,'ev');
    showFloat(card, '🔄NO U', '#ff4444');
    return 'reflected';
  }

  // Reflect chance (Baby Yoda)
  if(p && p.type==='reflect_chance' && isAtk && Math.random()<p.chance) {
    log(`🌀 ${card.name} uses the Force to reflect!`,'ev');
    return 'reflected';
  }

  // First damage reduce (Shrek)
  if(p && p.type==='first_dmg_reduce' && !p.used && isAtk) {
    dmg = Math.max(0, dmg-p.amt);
    p.used = true;
    log(`🟢 ${card.name}: First attack reduced by ${p.amt}!`,'ev');
  }

  // Burst (Harold) — stores damage
  if(p && p.type==='burst') {
    p.stored += dmg;
    log(`😬 ${card.name} absorbs ${dmg} (${p.stored} stored, releases turn ${3-p.turn}).`,'ev');
    card.curHp -= dmg; // still takes the damage physically for display
    shakeCard(card);
  } else {
    card.curHp -= dmg;
    shakeCard(card);
  }

  showFloat(card, `-${dmg}`, '#ff5555');

  // Enrage
  if(p && p.type==='enrage' && !p.used && dmg>0) {
    card.curAtk += p.bonus;
    p.used = true;
    log(`😡 ${card.name} ENRAGES! ATK +${p.bonus} (now ${card.curAtk})!`,'ev');
  }

  // Trollface reflect
  if(p && p.type==='reflect' && isAtk) {
    const src = G.turn==='player' ? G.player : G.ai;
    const srcCard = G.sel;
    if(srcCard) {
      log(`↩️ ${card.name} reflects ${p.amt} back!`,'ev');
      hurtCard(srcCard, src, p.amt, false);
    }
  }

  if(card.curHp <= 0) killCard(card, owner);
  return true;
}

function hurtHero(p, dmg) {
  p.hp = Math.max(0, p.hp-dmg);
  const el = document.getElementById(p.ai?'ai-hero':'player-hero');
  if(el) {
    const r = el.getBoundingClientRect();
    showFloatAt(r.left+r.width/2, r.top+r.height/2, `-${dmg}`, '#ff4444');
    el.style.animation='none'; void el.offsetWidth; el.style.animation='shake .3s ease';
  }
  render();
  checkWin();
}

function killCard(card, owner) {
  owner.field = owner.field.filter(c=>c.iid!==card.iid);
  log(`💀 ${card.name} was destroyed!`,'die');
  recalcGangs(owner);
  render();
}

function doAttack(attacker, attackerOwner, target, targetOwner) {
  // Taunt check
  const tauntCards = targetOwner.field.filter(c=>c.kw&&c.kw.includes('taunt'));
  if(tauntCards.length && !(target.kw&&target.kw.includes('taunt'))) {
    log('⚠️ Must attack the Taunt minion first!','ev');
    return false;
  }

  attacker.exhausted = true;
  let atkDmg = attacker.curAtk;

  // First attack double (Drake)
  if(attacker.passive?.type==='first_atk_double' && !attacker.passive.used) {
    atkDmg *= 2;
    attacker.passive.used = true;
    log(`🎤 ${attacker.name}: First attack DOUBLED!`,'ev');
  }
  // Last stand (Leonidas)
  if(attacker.passive?.type==='last_stand' && attacker.curHp/attacker.hp <= .30) {
    atkDmg *= attacker.passive.mult;
    log(`⚔️ ${attacker.name}: THIS IS SPARTA! DOUBLE DAMAGE!`,'ev');
  }

  log(`⚔️ ${attacker.name} attacks ${target.name}! (${atkDmg} vs ${target.curAtk})`,'ev');

  G.sel = attacker; // needed for reflect back reference
  const res = hurtCard(target, targetOwner, atkDmg, true);

  if(res==='reflected') {
    // Reflected — attacker takes their own damage
    hurtCard(attacker, attackerOwner, atkDmg, false);
  } else if(res==='dodge_counter') {
    // Confused math lady counters
    hurtCard(attacker, attackerOwner, target.curAtk, false);
  } else if(res!=='dodged') {
    // Normal trade — attacker takes defender's ATK
    hurtCard(attacker, attackerOwner, target.curAtk, false);
  }

  // Lifelink
  if(attacker.passive?.type==='lifelink' && res!=='dodged' && target.field) {
    // card still on field check happened already
  }
  if(attacker.passive?.type==='lifelink') {
    attackerOwner.hp = Math.min(attackerOwner.maxHp, attackerOwner.hp+atkDmg);
    log(`💚 ${attacker.name} lifelink heals ${attackerOwner.ai?'opponent':'you'} for ${atkDmg}!`,'heal');
  }

  G.sel = null;
  render();
  return true;
}

function doAttackHero(attacker, attackerOwner, defOwner) {
  const tauntCards = defOwner.field.filter(c=>c.kw&&c.kw.includes('taunt'));
  if(tauntCards.length) {
    log('⚠️ Must attack the Taunt minion first!','ev');
    return false;
  }

  attacker.exhausted = true;
  let atkDmg = attacker.curAtk;

  if(attacker.passive?.type==='first_atk_double' && !attacker.passive.used) {
    atkDmg *= 2; attacker.passive.used=true;
    log(`🎤 ${attacker.name}: DOUBLE first attack!`,'ev');
  }
  if(attacker.passive?.type==='last_stand' && attacker.curHp/attacker.hp<=.30) {
    atkDmg *= attacker.passive.mult;
    log(`⚔️ ${attacker.name}: SPARTA KICK to the face!`,'ev');
  }

  log(`🗡️ ${attacker.name} attacks ${defOwner.ai?'enemy':'your'} hero for ${atkDmg}!`,'dmg');
  hurtHero(defOwner, atkDmg);

  if(attacker.passive?.type==='lifelink') {
    attackerOwner.hp=Math.min(attackerOwner.maxHp,attackerOwner.hp+atkDmg);
    log(`💚 Lifelink heals ${atkDmg}!`,'heal');
  }

  G.sel=null;
  render();
  return true;
}

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function pickSilenceTarget(p) {
  if(!p.field.length) return null;
  return p.field[Math.floor(Math.random()*p.field.length)];
}

function recalcGang(p) {
  const minions = p.field.filter(c=>c.id==='minion');
  minions.forEach(c=>{ c.curAtk = c.atk + (minions.length-1); });
}
function recalcGangs(p) { recalcGang(p); }

// ═══════════════════════════════════════════
// AI
// ═══════════════════════════════════════════
function doAI() {
  if(G.gameOver) return;
  document.getElementById('ai-thinking').style.display='block';

  const ai=G.ai, pl=G.player;
  const queue=[];

  // --- Play cards (greedy: most expensive first) ---
  const affordable = [...ai.hand].filter(c=>c.cost<=ai.mana).sort((a,b)=>b.cost-a.cost);
  affordable.forEach(card=>{
    if(ai.mana>=card.cost && ai.field.length<5) {
      queue.push(()=>playCard(card,ai));
    }
  });

  // --- Attack phase ---
  // Check lethal
  const canLethal = () => {
    const totalDmg = ai.field.filter(c=>!c.exhausted).reduce((s,c)=>s+getEffAtk(c),0);
    return totalDmg >= pl.hp && pl.field.every(c=>!(c.kw&&c.kw.includes('taunt')));
  };

  queue.push(()=>{
    if(canLethal()) {
      ai.field.filter(c=>!c.exhausted).forEach(c=>{
        queue.splice(0,0,()=>doAttackHero(c,ai,pl));
      });
    } else {
      ai.field.filter(c=>!c.exhausted).forEach(card=>{
        const tauntCards = pl.field.filter(c=>c.kw&&c.kw.includes('taunt'));
        if(tauntCards.length) {
          queue.push(()=>doAttack(card,ai,tauntCards[0],pl));
        } else if(pl.field.length) {
          // Kill cheapest (lowest HP that dies to our attack), else highest ATK
          const killable = pl.field.filter(c=>c.curHp<=getEffAtk(card));
          if(killable.length) {
            const t = killable.reduce((a,b)=>a.curAtk>b.curAtk?a:b);
            queue.push(()=>doAttack(card,ai,t,pl));
          } else {
            const t = pl.field.reduce((a,b)=>a.curAtk>b.curAtk?a:b);
            queue.push(()=>doAttack(card,ai,t,pl));
          }
        } else {
          queue.push(()=>doAttackHero(card,ai,pl));
        }
      });
    }
  });

  // Execute queue with delay
  let t=0;
  queue.forEach(fn=>{ setTimeout(()=>{ if(!G.gameOver){ fn(); render(); } }, t); t+=600; });

  setTimeout(()=>{
    document.getElementById('ai-thinking').style.display='none';
    if(!G.gameOver){ G.turnNum++; startTurn('player'); }
  }, t+400);
}

function getEffAtk(c) {
  let a = c.curAtk;
  if(c.passive?.type==='last_stand' && c.curHp/c.hp<=.30) a*=c.passive.mult;
  if(c.passive?.type==='first_atk_double' && !c.passive.used) a*=2;
  return a;
}

// ═══════════════════════════════════════════
// WIN CONDITION
// ═══════════════════════════════════════════
function checkWin() {
  if(G.gameOver) return;
  if(G.player.hp<=0) { G.gameOver=true; showGameOver(false); }
  else if(G.ai.hp<=0) { G.gameOver=true; showGameOver(true); }
}

function showGameOver(won) {
  // Track stats
  const wins = parseInt(localStorage.getItem('ml_wins')||0) + (won?1:0);
  const losses = parseInt(localStorage.getItem('ml_losses')||0) + (won?0:1);
  localStorage.setItem('ml_wins', wins);
  localStorage.setItem('ml_losses', losses);

  const el=document.getElementById('game-over');
  el.className='show '+(won?'win':'lose');
  el.style.display='flex';
  document.getElementById('go-title').textContent = won ? '🏆 VICTORY!' : '💀 DEFEAT';
  document.getElementById('go-sub').textContent = won
    ? `Your memes were the dankest of all. Much skill. Very win. Wow. (W:${wins} L:${losses})`
    : `Your memes have been ratio'd. Press F. Try again. (W:${wins} L:${losses})`;
}

// ═══════════════════════════════════════════
// UI / RENDER
// ═══════════════════════════════════════════
function render() {
  // HP
  const phEl = document.getElementById('player-hp');
  const ahEl = document.getElementById('ai-hp');
  phEl.textContent = G.player.hp;
  ahEl.textContent = G.ai.hp;
  phEl.style.color = G.player.hp <= 10 ? '#ff4444' : '#44ff88';
  ahEl.style.color = G.ai.hp <= 10 ? '#ff4444' : '#44ff88';

  // Decks
  document.getElementById('player-deck').textContent = G.player.deck.length;
  document.getElementById('ai-deck').textContent = G.ai.deck.length;

  // Mana
  renderMana('player-mana', G.player);
  renderMana('ai-mana', G.ai);

  // Fields
  renderField('player-field', G.player, false);
  renderField('ai-field', G.ai, true);

  // Hands
  renderHand();
  renderAIHand();
}

function renderMana(id, p) {
  const el=document.getElementById(id);
  el.innerHTML='';
  for(let i=0;i<p.maxMana;i++) {
    const d=document.createElement('div');
    d.className='crystal '+(i<p.mana?'full':'empty');
    el.appendChild(d);
  }
  const lbl=document.createElement('span');
  lbl.className='mana-label';
  lbl.textContent=`${p.mana}/${p.maxMana}`;
  el.appendChild(lbl);
}

function renderField(id, p, isAI) {
  const el=document.getElementById(id);
  // Remove old cards
  [...el.querySelectorAll('.card')].forEach(c=>c.remove());

  p.field.forEach(card=>{
    const isAttackable = G.sel && !isAI && isAI===false; // won't use
    const ce = makeCardEl(card, p, false);

    if(!isAI) {
      // Player field card — click to select as attacker
      if(G.turn==='player' && !card.exhausted && !G.sel) {
        ce.classList.add('can-atk');
      }
      if(G.sel===card) ce.classList.add('selected');
      ce.addEventListener('click', ()=>{
        if(G.turn!=='player'||G.gameOver) return;
        if(G.sel===card) { G.sel=null; render(); return; }
        if(G.sel) { G.sel=null; render(); return; }
        if(card.exhausted) { log(`${card.name} already attacked this turn.`,'ev'); return; }
        G.sel=card;
        log(`🎯 ${card.name} ready. Click an enemy minion or their hero.`,'ev');
        render();
      });
    } else {
      // AI field card — click to attack with selected
      if(G.sel) ce.classList.add('targetable');
      ce.addEventListener('click', ()=>{
        if(G.turn!=='player'||G.gameOver) return;
        if(!G.sel) { log('⚠️ Select your own card first!','ev'); return; }
        doAttack(G.sel, G.player, card, G.ai);
      });
    }

    el.appendChild(ce);
  });
}

function renderHand() {
  const el=document.getElementById('player-hand');
  el.innerHTML='';
  G.player.hand.forEach(card=>{
    const ce=makeCardEl(card, G.player, true);
    const cantAfford = card.cost>G.player.mana || G.turn!=='player';
    if(cantAfford) ce.classList.add('unaffordable');
    ce.addEventListener('click', ()=>{
      if(G.turn!=='player'||G.gameOver) return;
      if(G.sel) { G.sel=null; render(); return; } // deselect first
      if(card.cost>G.player.mana) { log(`❌ Need ${card.cost} mana (have ${G.player.mana}).`,'ev'); return; }
      playCard(card, G.player);
    });
    // Tooltip on hover
    ce.addEventListener('mouseenter', e=>showTooltip(card, e));
    ce.addEventListener('mousemove', e=>moveTooltip(e));
    ce.addEventListener('mouseleave', ()=>hideTooltip());
    el.appendChild(ce);
  });
}

function renderAIHand() {
  const el=document.getElementById('ai-hand');
  el.innerHTML='';
  G.ai.hand.forEach(()=>{
    const d=document.createElement('div');
    d.className='ai-card-back';
    d.textContent='🂠';
    el.appendChild(d);
  });
}

function makeCardEl(card, owner, isHand) {
  const el=document.createElement('div');
  el.className='card';
  el.dataset.iid=card.iid;

  if(!isHand && card.exhausted) el.classList.add('exhausted');

  const hpPct=Math.max(0,(card.curHp/card.hp)*100);
  const hpColor = hpPct>60?'#44ff88':hpPct>30?'#ffcc44':'#ff4444';

  const kwBadges = (card.kw||[]).map(k=>`<span class="kw kw-${k}">${k}</span>`).join('');
  const statusIcons = (card.status?.burn?'🔥':'');

  el.innerHTML=`
    <div class="card-inner r-${card.rarity}" style="background:${card.bg};">
      <div class="cost-badge">${card.cost}</div>
      ${statusIcons?`<div class="status-row"><span class="sbadge">${statusIcons}</span></div>`:''}
      <div class="c-name">${card.name}</div>
      <div class="c-art">
        <img src="${card.img}" alt="${card.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span class="art-emoji" style="display:none">${card.art}</span>
      </div>
      <div class="c-ability">
        <div class="kwrap">${kwBadges}</div>
        ${card.abilityText||card.ability}
      </div>
      <div class="c-stats">
        <span class="c-atk">⚔️${card.curAtk}</span>
        <span class="c-hp" style="color:${hpColor}">❤️${card.curHp}</span>
      </div>
      <div class="hp-track">
        <div class="hp-fill" style="width:${hpPct}%;background:${hpColor};"></div>
      </div>
    </div>
  `;

  // Tooltip on field cards too
  el.addEventListener('mouseenter', e=>showTooltip(card, e));
  el.addEventListener('mousemove', e=>moveTooltip(e));
  el.addEventListener('mouseleave', ()=>hideTooltip());

  return el;
}

// ═══════════════════════════════════════════
// FLOATING DAMAGE
// ═══════════════════════════════════════════
function showFloat(card, txt, color) {
  const el=document.querySelector(`[data-iid="${card.iid}"]`);
  if(!el) return;
  const r=el.getBoundingClientRect();
  showFloatAt(r.left+r.width/2, r.top+r.height/3, txt, color);
}

function showFloatAt(x, y, txt, color) {
  const d=document.createElement('div');
  d.className='dmg-float';
  d.textContent=txt;
  d.style.cssText=`left:${x}px;top:${y}px;color:${color};font-size:1.4em;transform:translateX(-50%);`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 900);
}

function shakeCard(card) {
  const el=document.querySelector(`[data-iid="${card.iid}"]`);
  if(!el) return;
  el.style.animation='none';
  void el.offsetWidth;
  el.style.animation='shake .3s ease';
}

// ═══════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════
function showTooltip(card, e) {
  const t=document.getElementById('tooltip');
  document.getElementById('tt-name').textContent=`${card.name} (${card.cost}💧)`;
  document.getElementById('tt-body').innerHTML=
    `<b>ATK:</b> ${card.curAtk} &nbsp; <b>HP:</b> ${card.curHp}/${card.hp}<br>
     <b>Rarity:</b> ${card.rarity}<br>
     ${card.ability}`;
  document.getElementById('tt-flavor').textContent=`"${card.flavor}"`;
  t.style.display='block';
  moveTooltip(e);
}
function moveTooltip(e) {
  const t=document.getElementById('tooltip');
  let x=e.clientX+12, y=e.clientY-10;
  if(x+205>window.innerWidth) x=e.clientX-215;
  if(y+t.offsetHeight>window.innerHeight) y=e.clientY-t.offsetHeight;
  t.style.left=x+'px'; t.style.top=y+'px';
}
function hideTooltip() { document.getElementById('tooltip').style.display='none'; }

// ═══════════════════════════════════════════
// LOG
// ═══════════════════════════════════════════
function log(msg, type='') {
  const el=document.getElementById('log');
  const d=document.createElement('div');
  d.className='le '+(type||'');
  d.textContent=msg;
  el.appendChild(d);
  el.scrollTop=el.scrollHeight;
  while(el.children.length>60) el.removeChild(el.firstChild);
}
function clearLog() { document.getElementById('log').innerHTML=''; }

// ═══════════════════════════════════════════
// HERO CLICK (attack face)
// ═══════════════════════════════════════════
document.getElementById('ai-hero').addEventListener('click',()=>{
  if(G.turn!=='player'||G.gameOver) return;
  if(!G.sel) { log('⚠️ Select your own minion first!','ev'); return; }
  doAttackHero(G.sel, G.player, G.ai);
});

document.getElementById('end-turn-btn').addEventListener('click', endTurn);

// ═══════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') { G.sel=null; render(); }
  if(e.key==='Enter' && G.turn==='player' && !G.gameOver) endTurn();
});

// ═══════════════════════════════════════════
// START
// ═══════════════════════════════════════════
initGame();
</script>
