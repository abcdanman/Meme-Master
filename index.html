<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meme Legends: Card Battle</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'Exo 2',sans-serif;
  background: radial-gradient(ellipse at 50% 30%, #1a3a1a 0%, #0a180a 55%, #050c05 100%);
  min-height:100vh;
  color:#fff;
  overflow:hidden;
  user-select:none;
}

/* ── FLOATING BACKGROUND MEMES ── */
#bg-memes {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  overflow:hidden;
}
.bg-meme {
  position:absolute;
  border-radius:12px;
  opacity:0.07;
  filter:blur(1px);
  animation: float-meme linear infinite;
  border:2px solid rgba(255,255,255,0.1);
}
@keyframes float-meme {
  0%   { transform: translateY(110vh) rotate(0deg) scale(1); }
  100% { transform: translateY(-20vh) rotate(20deg) scale(1.1); }
}

/* ── LAYOUT ── */
#app {
  position:relative; z-index:1;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:100vh;
  padding:20px;
  gap:0;
}

/* ── TITLE ── */
.title-wrap {
  text-align:center;
  margin-bottom:32px;
  animation: drop-in .7s cubic-bezier(.22,1,.36,1) both;
}
@keyframes drop-in {
  from { transform:translateY(-60px); opacity:0; }
  to   { transform:translateY(0);     opacity:1; }
}
.title-emoji { font-size:3em; display:block; margin-bottom:4px; animation:spin-in .6s ease both; }
@keyframes spin-in {
  from { transform:rotate(-15deg) scale(.5); opacity:0; }
  to   { transform:rotate(0) scale(1); opacity:1; }
}
.title-main {
  font-family:'Cinzel',serif;
  font-size:clamp(2.2em,6vw,3.8em);
  font-weight:900;
  background:linear-gradient(135deg,#ffdd66,#ff9900,#ffdd66);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  text-shadow:none;
  letter-spacing:2px;
  filter:drop-shadow(0 0 18px rgba(255,180,0,.5));
}
.title-sub {
  font-size:1em; color:#888; letter-spacing:4px;
  text-transform:uppercase; margin-top:4px;
}

/* ── PLAYER CARD (shown after profile set) ── */
#player-card {
  display:flex; align-items:center; gap:14px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  padding:10px 20px;
  margin-bottom:28px;
  animation: fade-up .5s .3s ease both;
  cursor:pointer; transition:all .2s;
}
#player-card:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.2); }
@keyframes fade-up {
  from { transform:translateY(20px); opacity:0; }
  to   { transform:translateY(0);    opacity:1; }
}
#player-avatar {
  width:52px; height:52px; border-radius:50%;
  object-fit:cover; object-position:center top;
  border:2px solid #ffaa00;
  box-shadow:0 0 12px rgba(255,170,0,.4);
  background:#1a1a2a;
}
.player-info { text-align:left; }
.player-name { font-weight:700; font-size:1.05em; }
.player-stats { font-size:.72em; color:#888; margin-top:2px; }
.edit-hint { font-size:.6em; color:#666; margin-top:1px; }

/* ── MENU BUTTONS ── */
#menu {
  display:flex; flex-direction:column; gap:14px; width:100%; max-width:320px;
  animation: fade-up .5s .45s ease both;
}
.menu-btn {
  display:flex; align-items:center; gap:14px;
  padding:16px 28px;
  border-radius:16px;
  border:2px solid;
  font-family:'Exo 2',sans-serif;
  font-size:1.05em; font-weight:700;
  cursor:pointer;
  transition:all .2s;
  text-decoration:none; color:#fff;
  letter-spacing:.5px;
  position:relative; overflow:hidden;
}
.menu-btn::before {
  content:''; position:absolute; inset:0;
  background:rgba(255,255,255,0);
  transition:background .2s;
}
.menu-btn:hover::before { background:rgba(255,255,255,0.06); }
.menu-btn:hover { transform:translateX(6px) scale(1.02); }
.menu-btn:active { transform:translateX(3px) scale(.99); }

.btn-play {
  background:linear-gradient(135deg,#1a5a1a,#0a3a0a);
  border-color:#44cc66;
  box-shadow:0 0 20px rgba(68,204,102,.2);
}
.btn-play:hover { box-shadow:0 0 30px rgba(68,204,102,.4); }

.btn-profile {
  background:linear-gradient(135deg,#1a1a5a,#0a0a3a);
  border-color:#4466ff;
  box-shadow:0 0 16px rgba(68,102,255,.15);
}
.btn-profile:hover { box-shadow:0 0 28px rgba(68,102,255,.35); }

.btn-versus {
  background:linear-gradient(135deg,#3a001a,#1a000a);
  border-color:#ff4466;
  box-shadow:0 0 16px rgba(255,68,102,.15);
}
.btn-versus:hover { box-shadow:0 0 28px rgba(255,68,102,.35); }

.btn-settings {
  background:linear-gradient(135deg,#3a2a00,#1a1200);
  border-color:#cc8800;
  box-shadow:0 0 16px rgba(204,136,0,.15);
}
.btn-settings:hover { box-shadow:0 0 28px rgba(204,136,0,.35); }

.btn-icon { font-size:1.5em; flex-shrink:0; }
.btn-text { flex:1; }
.btn-label { display:block; }
.btn-desc  { display:block; font-size:.68em; font-weight:400; color:rgba(255,255,255,.55); margin-top:1px; }
.btn-arrow { font-size:.85em; opacity:.5; }

/* ── VERSION ── */
.version {
  margin-top:32px;
  font-size:.65em; color:#444; letter-spacing:2px;
  animation: fade-up .5s .6s ease both;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }
</style>
</head>
<body>

<!-- Floating background memes -->
<div id="bg-memes"></div>

<div id="app">
  <!-- Title -->
  <div class="title-wrap">
    <span class="title-emoji">🃏</span>
    <div class="title-main">MEME LEGENDS</div>
    <div class="title-sub">Card Battle</div>
  </div>

  <!-- Player card -->
  <div id="player-card" onclick="window.location.href='profile.html'">
    <img id="player-avatar" src="" alt="Avatar" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22/>'">
    <div class="player-info">
      <div class="player-name" id="player-name">Anonymous Memer</div>
      <div class="player-stats" id="player-stats">W: 0 &nbsp;|&nbsp; L: 0 &nbsp;|&nbsp; Win Rate: 0%</div>
      <div class="edit-hint">✏️ Click to edit profile</div>
    </div>
  </div>

  <!-- Menu -->
  <nav id="menu">
    <a class="menu-btn btn-play" href="game.html">
      <span class="btn-icon">⚔️</span>
      <span class="btn-text">
        <span class="btn-label">PLAY</span>
        <span class="btn-desc">Battle the AI with meme cards</span>
      </span>
      <span class="btn-arrow">▶</span>
    </a>

    <a class="menu-btn btn-profile" href="profile.html">
      <span class="btn-icon">🧙</span>
      <span class="btn-text">
        <span class="btn-label">PROFILE</span>
        <span class="btn-desc">Change avatar &amp; view stats</span>
      </span>
      <span class="btn-arrow">▶</span>
    </a>

    <a class="menu-btn btn-versus" href="multiplayer.html">
      <span class="btn-icon">👥</span>
      <span class="btn-text">
        <span class="btn-label">VS FRIEND</span>
        <span class="btn-desc">Hot seat · 2 players · 1 screen</span>
      </span>
      <span class="btn-arrow">▶</span>
    </a>

    <a class="menu-btn btn-settings" href="settings.html">
      <span class="btn-icon">⚙️</span>
      <span class="btn-text">
        <span class="btn-label">SETTINGS</span>
        <span class="btn-desc">Difficulty, sound &amp; more</span>
      </span>
      <span class="btn-arrow">▶</span>
    </a>
  </nav>

  <div class="version">v1.0.0 &nbsp;·&nbsp; MEME LEGENDS</div>
</div>

<script>
const MEME_AVATARS = [
  { id:'doge',          name:'Doge',              img:'https://i.kym-cdn.com/photos/images/original/000/581/296/c09.jpg' },
  { id:'fire_dog',      name:'This Is Fine',       img:'https://i.imgflip.com/wxica.jpg' },
  { id:'grumpy_cat',    name:'Grumpy Cat',         img:'https://i.kym-cdn.com/entries/icons/facebook/000/011/365/GRUMPYCAT.jpg' },
  { id:'trollface',     name:'Trollface',           img:'https://i.kym-cdn.com/entries/icons/facebook/000/000/091/TrollFace.jpg' },
  { id:'drake',         name:'Drake',              img:'https://i.imgflip.com/30b1gx.jpg' },
  { id:'distracted_bf', name:'Distracted BF',      img:'https://i.imgflip.com/1ur9b0.jpg' },
  { id:'surprised_pika',name:'Surprised Pikachu',  img:'https://i.imgflip.com/2kbn1e.jpg' },
  { id:'woman_cat',     name:'Woman Yelling',      img:'https://i.imgflip.com/345v97.jpg' },
  { id:'pepe',          name:'Pepe the Frog',      img:'https://i.kym-cdn.com/entries/icons/original/000/000/142/feelsgoodman.png' },
  { id:'chad',          name:'Gigachad',           img:'https://i.kym-cdn.com/entries/icons/facebook/000/026/152/gigachadd.jpg' },
  { id:'galaxy_brain',  name:'Galaxy Brain',       img:'https://i.imgflip.com/1jwhww.jpg' },
  { id:'harold',        name:'Hide the Pain Harold',img:'https://i.imgflip.com/gk5el.jpg' },
  { id:'minion',        name:"Gru's Minion",       img:'https://i.imgflip.com/26jxvz.jpg' },
  { id:'salt_bae',      name:'Salt Bae',           img:'https://i.kym-cdn.com/entries/icons/facebook/000/021/971/Salt-Bae-001.jpg' },
  { id:'two_buttons',   name:'Two Buttons Guy',    img:'https://i.imgflip.com/1g8my4.jpg' },
  { id:'expand_brain',  name:'Expanding Brain',    img:'https://i.imgflip.com/1jwhww.jpg' },
  { id:'confused_math', name:'Confused Math Lady', img:'https://i.kym-cdn.com/entries/icons/facebook/000/021/464/14608107_1180665285312703_1558693314_n.jpg' },
  { id:'baby_yoda',     name:'Baby Yoda',          img:'https://i.kym-cdn.com/entries/icons/mobile/000/031/827/bright.jpg' },
  { id:'shrek',         name:'Shrek',              img:'https://i.kym-cdn.com/entries/icons/facebook/000/012/178/shrek.jpg' },
  { id:'mock_spong',    name:'Mocking SpongeBob',  img:'https://i.imgflip.com/1otk96.jpg' },
  { id:'stonks',        name:'Stonks Man',         img:'https://i.kym-cdn.com/entries/icons/facebook/000/029/959/Screen_Shot_2019-06-05_at_1.26.32_PM.jpg' },
  { id:'leonidas',      name:'Leonidas',           img:'https://i.kym-cdn.com/entries/icons/facebook/000/000/026/Gerard-Butler-This-Is-Sparta.jpg' },
  { id:'uno_reverse',   name:'UNO Reverse',        img:'https://i.imgflip.com/3lmzyx.jpg' },
  { id:'bernie',        name:'Bernie Mittens',     img:'https://i.imgflip.com/3oevdk.jpg' },
  { id:'disaster_girl', name:'Disaster Girl',      img:'https://i.imgflip.com/23ls.jpg' }
];

// ── LOAD PROFILE ──
function loadProfile() {
  const name   = localStorage.getItem('ml_name') || 'Anonymous Memer';
  const avatarId = localStorage.getItem('ml_avatar') || '';
  const wins   = parseInt(localStorage.getItem('ml_wins')  || 0);
  const losses = parseInt(localStorage.getItem('ml_losses')|| 0);
  const total  = wins + losses;
  const rate   = total ? Math.round((wins/total)*100) : 0;

  document.getElementById('player-name').textContent = name;
  document.getElementById('player-stats').textContent =
    `W: ${wins}  |  L: ${losses}  |  Win Rate: ${rate}%`;

  const avatarObj = MEME_AVATARS.find(a=>a.id===avatarId) || MEME_AVATARS[0];
  document.getElementById('player-avatar').src = avatarObj.img;
}

// ── FLOATING BG MEMES ──
function spawnBgMemes() {
  const container = document.getElementById('bg-memes');
  const picks = MEME_AVATARS.sort(()=>Math.random()-.5).slice(0,10);

  picks.forEach((meme, i) => {
    const el = document.createElement('img');
    el.className = 'bg-meme';
    const size = 80 + Math.random() * 120;
    const left = Math.random() * 95;
    const dur  = 18 + Math.random() * 20;
    const delay= -(Math.random() * dur);
    el.style.cssText = `
      width:${size}px; height:${size}px;
      left:${left}%;
      bottom:-${size}px;
      animation-duration:${dur}s;
      animation-delay:${delay}s;
      object-fit:cover;
    `;
    el.src = meme.img;
    container.appendChild(el);
  });
}

loadProfile();
spawnBgMemes();
</script>
</body>
</html>
